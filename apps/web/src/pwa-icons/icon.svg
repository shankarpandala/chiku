     public/icons/icon-192.png and icon-512.png (see M3 notes). -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#fdf6ec"/>
