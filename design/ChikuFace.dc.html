<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes chikuRing { 0%{transform:scale(1);opacity:.85} 50%{transform:scale(1.045);opacity:.35} 100%{transform:scale(1);opacity:.85} }
@keyframes chikuSpin { to { transform: rotate(360deg) } }
@keyframes chikuBar { 0%,100%{transform:scaleY(.35)} 50%{transform:scaleY(1)} }
@keyframes chikuBlink { 0%,92%,100%{transform:scaleY(1)} 96%{transform:scaleY(.08)} }
@media (prefers-reduced-motion: reduce){ *{animation:none !important} }
html,body{height:100%;margin:0}
</style>
</helmet>
<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative">
  <svg viewBox="{{ box }}" style="width:100%;height:100%;max-height:100vh;overflow:visible;display:block" aria-hidden="true">
    <sc-if value="{{ ring }}" hint-placeholder-val="{{ false }}">
      <g>
        <circle cx="120" cy="112" r="128" fill="none" stroke="#2f8f86" stroke-width="4" stroke-dasharray="14 12" style="animation:chikuSpin 9s linear infinite;transform-origin:120px 112px"></circle>
        <circle cx="120" cy="112" r="112" fill="none" stroke="#2f8f86" stroke-width="9" opacity=".26" style="animation:chikuRing 1.6s ease-in-out infinite;transform-origin:120px 112px"></circle>
      </g>
    </sc-if>

    <g transform="{{ tilt }}" style="transform-origin:120px 170px">
      <sc-if value="{{ showBody }}" hint-placeholder-val="{{ false }}">
        <g>
          <rect x="82" y="290" width="30" height="48" rx="15" fill="#8b7ab0"></rect>
          <rect x="128" y="290" width="30" height="48" rx="15" fill="#8b7ab0"></rect>
          <ellipse cx="97" cy="338" rx="19" ry="11" fill="#cdc3e4"></ellipse>
          <ellipse cx="143" cy="338" rx="19" ry="11" fill="#cdc3e4"></ellipse>
          <ellipse cx="120" cy="252" rx="68" ry="64" fill="#a293c4"></ellipse>
          <ellipse cx="120" cy="268" rx="41" ry="40" fill="#cdc3e4"></ellipse>
        </g>
      </sc-if>

      <g transform="{{ earL }}" style="transform-origin:76px 104px">
        <ellipse cx="34" cy="98" rx="46" ry="53" fill="#8b7ab0"></ellipse>
        <ellipse cx="24" cy="99" rx="25" ry="31" fill="#e9b6b4"></ellipse>
      </g>
      <g transform="{{ earR }}" style="transform-origin:164px 104px">
        <ellipse cx="206" cy="98" rx="46" ry="53" fill="#8b7ab0"></ellipse>
        <ellipse cx="216" cy="99" rx="25" ry="31" fill="#e9b6b4"></ellipse>
      </g>

      <path d="M120 28 C182 28 198 66 198 110 C198 164 166 200 120 200 C74 200 42 164 42 110 C42 66 58 28 120 28 Z" fill="#a293c4"></path>
      <path d="M100 31 C97 19 105 11 113 15" fill="none" stroke="#8b7ab0" stroke-width="7" stroke-linecap="round"></path>
      <path d="M118 28 C120 16 130 10 136 16" fill="none" stroke="#8b7ab0" stroke-width="7" stroke-linecap="round"></path>

      <sc-if value="{{ blush }}" hint-placeholder-val="{{ false }}">
        <g opacity=".5">
          <ellipse cx="66" cy="142" rx="17" ry="9" fill="#e9848c"></ellipse>
          <ellipse cx="178" cy="142" rx="17" ry="9" fill="#e9848c"></ellipse>
        </g>
      </sc-if>

      <sc-if value="{{ eyesOpen }}" hint-placeholder-val="{{ true }}">
        <g style="animation:chikuBlink 5.2s ease-in-out infinite;transform-origin:120px 96px">
          <ellipse cx="88" cy="96" rx="{{ eyeR }}" ry="{{ eyeR }}" fill="#fdf6ec"></ellipse>
          <ellipse cx="156" cy="96" rx="{{ eyeR }}" ry="{{ eyeR }}" fill="#fdf6ec"></ellipse>
          <circle cx="{{ pupilLX }}" cy="{{ pupilY }}" r="10" fill="#2c2a35"></circle>
          <circle cx="{{ pupilRX }}" cy="{{ pupilY }}" r="10" fill="#2c2a35"></circle>
          <circle cx="{{ glintLX }}" cy="{{ glintY }}" r="3.6" fill="#fdf6ec"></circle>
          <circle cx="{{ glintRX }}" cy="{{ glintY }}" r="3.6" fill="#fdf6ec"></circle>
        </g>
      </sc-if>
      <sc-if value="{{ eyesHappy }}" hint-placeholder-val="{{ false }}">
        <g fill="none" stroke="#2c2a35" stroke-width="7" stroke-linecap="round">
          <path d="M75 100 Q88 84 101 100"></path>
          <path d="M143 100 Q156 84 169 100"></path>
        </g>
      </sc-if>

      <g fill="none" stroke="#2c2a35" stroke-width="6" stroke-linecap="round" opacity=".9">
        <path d="{{ browL }}"></path>
        <path d="{{ browR }}"></path>
      </g>

      <g transform="translate(4,0)">
        <path d="{{ mouthPath }}" fill="#2c2a35"></path>
        <sc-if value="{{ tongue }}" hint-placeholder-val="{{ false }}">
          <ellipse cx="124" cy="184" rx="13" ry="9" fill="#e9848c"></ellipse>
        </sc-if>
      </g>

      <g>
        <path d="{{ t3 }}" fill="none" stroke="#7d6da3" stroke-width="27" stroke-linecap="round"></path>
        <path d="{{ t2 }}" fill="none" stroke="#7d6da3" stroke-width="37" stroke-linecap="round"></path>
        <path d="{{ t1 }}" fill="none" stroke="#7d6da3" stroke-width="47" stroke-linecap="round"></path>
        <path d="{{ t3 }}" fill="none" stroke="#a698ca" stroke-width="21" stroke-linecap="round"></path>
        <path d="{{ t2 }}" fill="none" stroke="#a698ca" stroke-width="31" stroke-linecap="round"></path>
        <path d="{{ t1 }}" fill="none" stroke="#a698ca" stroke-width="41" stroke-linecap="round"></path>
        <path d="{{ t1 }}" fill="none" stroke="#7d6da3" stroke-width="41" stroke-linecap="butt" opacity=".2" stroke-dasharray="3 15" stroke-dashoffset="16"></path>
      </g>
    </g>
  </svg>

  <sc-if value="{{ bars }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;bottom:-4%;left:50%;transform:translateX(-50%);display:flex;gap:7px;align-items:flex-end;height:40px">
      <div style="width:9px;height:100%;background:#2f8f86;border-radius:5px;animation:chikuBar .9s ease-in-out infinite"></div>
      <div style="width:9px;height:100%;background:#2f8f86;border-radius:5px;animation:chikuBar .9s ease-in-out infinite;animation-delay:.15s"></div>
      <div style="width:9px;height:100%;background:#2f8f86;border-radius:5px;animation:chikuBar .9s ease-in-out infinite;animation-delay:.3s"></div>
      <div style="width:9px;height:100%;background:#2f8f86;border-radius:5px;animation:chikuBar .9s ease-in-out infinite;animation-delay:.45s"></div>
      <div style="width:9px;height:100%;background:#2f8f86;border-radius:5px;animation:chikuBar .9s ease-in-out infinite;animation-delay:.6s"></div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:420},&quot;emote&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;listening&quot;,&quot;happy&quot;,&quot;encouraging&quot;,&quot;goodbye&quot;,&quot;thinking&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;viseme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;closed&quot;,&quot;A&quot;,&quot;E&quot;,&quot;O&quot;,&quot;U&quot;,&quot;F&quot;,&quot;L&quot;,&quot;smile&quot;],&quot;default&quot;:&quot;closed&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showBody&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;ring&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;bars&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;crop&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;full&quot;,&quot;head&quot;],&quot;default&quot;:&quot;full&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const MOUTHS = {
  closed: "M102 174 Q124 187 146 174 Q124 181 102 174 Z",
  A: "M105 166 Q124 157 143 166 Q138 196 124 196 Q110 196 105 166 Z",
  E: "M103 169 Q124 163 145 169 Q135 186 124 186 Q113 186 103 169 Z",
  O: "M124 160 C136 160 143 169 143 179 C143 190 136 198 124 198 C112 198 105 190 105 179 C105 169 112 160 124 160 Z",
  U: "M124 163 C133 163 139 171 139 180 C139 190 132 197 124 197 C116 197 109 190 109 180 C109 171 115 163 124 163 Z",
  F: "M103 174 Q124 167 145 174 Q124 186 103 174 Z",
  L: "M105 166 Q124 157 143 166 Q138 194 124 194 Q110 194 105 166 Z",
  smile: "M100 168 Q124 203 148 168 Q124 180 100 168 Z"
};
const TRUNKS = {
  down: ["M110 122 C104 140 96 154 84 162", "M84 162 C72 170 58 170 50 162", "M50 162 C43 155 44 145 51 141"],
  wave: ["M110 122 C104 138 98 150 88 156", "M88 156 C76 160 62 154 58 142", "M58 142 C56 130 62 122 70 122"],
  lift: ["M110 122 C104 138 98 150 88 156", "M88 156 C76 160 64 156 60 146", "M60 146 C58 138 62 132 68 131"]
};

class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const emote = p.emote || "idle";
    const showBody = p.showBody ?? false;
    const listening = emote === "listening";
    const happy = emote === "happy";
    const goodbye = emote === "goodbye";
    const thinking = emote === "thinking";
    const encouraging = emote === "encouraging";

    let viseme = p.viseme || (happy || goodbye ? "smile" : "closed");
    if (thinking && !p.viseme) viseme = "U";

    const eyesHappy = happy || goodbye;
    const look = thinking ? 1 : 0;
    const trunk = goodbye ? TRUNKS.wave : (encouraging || thinking) ? TRUNKS.lift : TRUNKS.down;

    return {
      box: p.crop === "head" ? "8 6 224 212" : (showBody ? "0 0 240 356" : "0 0 240 248"),
      showBody,
      ring: p.ring ?? listening,
      bars: p.bars ?? listening,
      tilt: listening ? "rotate(-5)" : encouraging ? "rotate(3)" : goodbye ? "rotate(-4)" : "rotate(0)",
      earL: listening ? "rotate(-14) scale(1.08)" : goodbye ? "rotate(-8)" : "rotate(0)",
      earR: listening ? "rotate(5)" : happy ? "rotate(9)" : "rotate(0)",
      eyesOpen: !eyesHappy,
      eyesHappy,
      eyeR: listening ? 19 : 17,
      pupilY: 96 + (look ? -5 : 2),
      pupilLX: 88 + (look ? 6 : 2),
      pupilRX: 156 + (look ? 6 : 2),
      glintY: 90 + (look ? -5 : 0),
      glintLX: 82 + (look ? 6 : 0),
      glintRX: 150 + (look ? 6 : 0),
      browL: listening ? "M74 62 Q88 52 102 58" : encouraging ? "M74 64 Q88 52 102 60" : thinking ? "M74 66 Q88 54 102 62" : "M76 66 Q88 60 100 64",
      browR: listening ? "M142 58 Q156 52 170 62" : encouraging ? "M142 60 Q156 56 170 66" : thinking ? "M142 56 Q156 48 170 58" : "M144 64 Q156 60 168 66",
      mouthPath: MOUTHS[viseme] || MOUTHS.closed,
      tongue: viseme === "L",
      blush: happy || encouraging,
      t1: trunk[0], t2: trunk[1], t3: trunk[2]
    };
  }
}
</script>
</body>
</html>
